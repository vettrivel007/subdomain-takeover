<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5f5">
  <title>Subdomain Takeover</title>
  <style>
    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #171717;
      background:
        radial-gradient(ellipse at 50% 45%, #ffffff 0%, #f3f3f3 48%, #e7e7e7 100%);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .message {
      max-width: 900px;
      text-align: center;
      font-size: clamp(24px, 4.2vw, 43px);
      font-weight: 500;
      line-height: 1.45;
      letter-spacing: -0.045em;
      animation: fade-up 900ms cubic-bezier(.2,.75,.25,1) both;
    }

    .message a {
      color: #555;
      text-decoration: none;
      font-weight: 600;
      border-bottom: 1px solid #999;
      transition: color 220ms ease, border-color 220ms ease;
    }

    .message a:hover {
      color: #000;
      border-color: #111;
    }

    .accent {
      display: inline-block;
      color: #777;
      animation: reveal 1.1s ease both;
      animation-delay: 250ms;
    }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes reveal {
      from { opacity: 0; filter: blur(5px); }
      to   { opacity: 1; filter: blur(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="message">
    <span class="accent">Subdomain takeover</span> by Vettrivel —
    for contact <a href="https://www.linkedin.com/in/YOUR-LINKEDIN-HANDLE/"
                   target="_blank" rel="noopener noreferrer">LinkedIn</a>.
  </main>
</body>
</html>
